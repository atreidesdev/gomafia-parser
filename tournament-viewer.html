function buildTableFilterHtml(t) {
  const tid = getTournamentKey(t);
  const allTableNums = getTournamentTableNumbers(t);
  if (!allTableNums.length) return '';

  const hiddenCount = getHiddenTableCount(tid);
  const isPanelOpen = !!state.tableFilterOpen[tid];

  const optionsHtml = allTableNums.map(num => {
    const hidden = isTableHidden(tid, num);
    return `<label class="table-filter-option${hidden ? ' is-hidden' : ''}">
      <input type="checkbox" ${hidden ? 'checked' : ''} data-table-number="${escapeHtml(num)}" onchange="toggleHiddenTableFromCheckbox(this)">
      <span>Стол ${escapeHtml(num)}</span>
    </label>`;
  }).join('');

  return `
    <div class="table-filter" data-tid="${escapeHtml(tid)}">
      <button type="button" class="table-filter-toggle" onclick="toggleTableFilterPanel(this)">
        🚫 Скрыть столы
        ${hiddenCount > 0 ? `<span class="tf-count">${hiddenCount} скрыто</span>` : ''}
        <span class="tf-arrow">${isPanelOpen ? '▲' : '▼'}</span>
      </button>
      <div class="table-filter-panel" style="display:${isPanelOpen ? 'block' : 'none'};">
        <div class="table-filter-actions">
          <button type="button" class="table-filter-action-btn" onclick="hideAllTablesForTournamentFromBtn(this)">Скрыть все</button>
          <button type="button" class="table-filter-action-btn danger" onclick="clearHiddenTablesForTournamentFromBtn(this)">Сбросить</button>
        </div>
        <div class="table-filter-options">${optionsHtml}</div>
      </div>
    </div>
  `;
}

function buildTournamentElement(t, games, filters) {
  const details = document.createElement('details');
  details.className = 'tournament-block';
  details.open = true;

  const gamesCount = games.reduce((s, g) => s + g.tables.length, 0);
  const dateStr = t.dateStart ? `${t.dateStart}${t.dateEnd && t.dateEnd !== t.dateStart ? ' – ' + t.dateEnd : ''}` : '';
  const typeStr = t.typeTranslate || (t.type === 'team' ? 'Командный' : t.type === 'individual' ? 'Личный' : '');

  let quick = `<span class="tq-item"><span class="tq-lbl">Игр</span><b>${gamesCount}</b></span>`;
  if (t.star !== null && t.star !== undefined) quick += `<span class="tq-item"><span class="tq-lbl">⭐</span><b>${t.star}</b></span>`;
  if (t.elo_average !== null && t.elo_average !== undefined) quick += `<span class="tq-item"><span class="tq-lbl">ELO ср.</span><b>${t.elo_average}</b></span>`;

  const chips = [];
  if (dateStr) chips.push(`<span class="meta-chip">📅 ${escapeHtml(dateStr)}</span>`);
  if (typeStr) chips.push(`<span class="meta-chip">📊 ${escapeHtml(typeStr)}</span>`);
  if (t.city) chips.push(`<span class="meta-chip">📍 ${escapeHtml(t.city)}</span>`);
  if (t.hasFinalStage) chips.push(`<span class="meta-chip">🏁 Финал: ${t.scheme?.final || 0} игр</span>`);

  let teamHtml = '';
  const myTeam = (t.teams || [])[0];
  if (myTeam && myTeam.title) {
    const members = (myTeam.users || []).map(u => `<span class="team-member">${escapeHtml(u.login)}</span>`).join('');
    teamHtml = `<div class="tournament-team">
      <div class="team-head">
        <span class="team-name">👥 ${escapeHtml(myTeam.title)}</span>
        <span class="team-meta">Место: <b>${myTeam.place}</b> / ${t.teams.length} · Σ <b>${myTeam.sum ?? '—'}</b> · GG <b>${myTeam.gg ?? '—'}</b></span>
      </div>
      <div class="team-members">${members}</div>
    </div>`;
  }

  const tableFilterHtml = buildTableFilterHtml(t);

  const standingsBody = buildStandingsSection(t, filters);
  let standingsHtml = '';
  if (standingsBody) {
    standingsHtml = `<details class="standings-details" open>
         <summary>📋 Таблица результатов <span class="standings-count">клик по игроку — фильтр игр</span></summary>
         <div class="standings-body">${standingsBody}</div>
       </details>`;
  } else {
    const playersListBody = buildPlayersListSection(t, filters);
    if (playersListBody) {
      standingsHtml = `<details class="standings-details" open>
         <summary>📋 Таблица результатов (по играм) <span class="standings-count">клик по игроку — фильтр игр</span></summary>
         <div class="standings-body">${playersListBody}</div>
       </details>`;
    }
  }

  details.innerHTML = `
    <summary>
      <span class="tournament-header-inner">
        <span class="tournament-title-group">
          <a href="${escapeHtml(t.url || '#')}" target="_blank" rel="noopener" class="tournament-title" onclick="event.stopPropagation()">🏆 ${escapeHtml(t.tournament)} ↗</a>
        </span>
        <span class="tournament-quick">${quick}</span>
      </span>
    </summary>
    <div class="tournament-meta">${chips.join('')}</div>
    ${tableFilterHtml}
    ${teamHtml}
    ${standingsHtml}
    <div class="tours-container"></div>
  `;

  const toursContainer = details.querySelector('.tours-container');
  renderToursInto(toursContainer, t, games, filters);

  return details;
}

// =====================================================================
// РЕНДЕР ТУРОВ
// =====================================================================
function renderToursInto(container, tournament, games, filters) {
  let singleBuffer = [];

  const flushSingles = () => {
    if (!singleBuffer.length) return;
    const group = document.createElement('div');
    group.className = 'tour-singles-group';

    const firstGame = singleBuffer[0].game;
    const lastGame = singleBuffer[singleBuffer.length - 1].game;
    const round = firstGame.round || '';
    const rangeStr = firstGame.gameNumber === lastGame.gameNumber
      ? `Игра ${firstGame.gameNumber}`
      : `Игры ${firstGame.gameNumber}–${lastGame.gameNumber}`;
    const roundBadge = round
      ? `<span class="tour-round-badge ${getRoundClass(round)}">${escapeHtml(round)}</span>`
      : '';

    group.innerHTML = `
      <div class="tour-singles-header">
        <span class="tour-singles-title">🎮 ${escapeHtml(rangeStr)}</span>
        ${roundBadge}
        <span class="tour-tables-count">${singleBuffer.length} ${pluralize(singleBuffer.length, 'игра', 'игры', 'игр')}</span>
      </div>
      <div class="tour-tables-scroll"></div>
    `;

    const scroll = group.querySelector('.tour-tables-scroll');
    singleBuffer.forEach(({ game, table }) => {
      scroll.appendChild(buildGameCard(tournament, game, table, filters, { showGameInfo: true }));
    });
    container.appendChild(group);
    singleBuffer = [];
  };

  games.forEach(({ game, tables }) => {
    const originalTablesCount = Array.isArray(game.tables) ? game.tables.length : tables.length;
    const isTrueSingleTableTour = originalTablesCount === 1;

    if (isTrueSingleTableTour && tables.length === 1) {
      singleBuffer.push({ game, table: tables[0] });
    } else {
      flushSingles();
      container.appendChild(buildTourBlock(tournament, game, tables, filters));
    }
  });
  flushSingles();
}

function buildTourBlock(tournament, game, tables, filters) {
  const block = document.createElement('div');
  block.className = 'tour-block';

  const roundBadge = game.round
    ? `<span class="tour-round-badge ${getRoundClass(game.round)}">${escapeHtml(game.round)}</span>`
    : '';

  const originalCount = Array.isArray(game.tables) ? game.tables.length : tables.length;
  const isFiltered = originalCount !== tables.length;
  const countText = isFiltered
    ? `<span style="color:var(--warning);font-weight:700;">показано ${tables.length} из ${originalCount}</span>`
    : `${tables.length} ${pluralize(tables.length, 'стол', 'стола', 'столов')}`;

  block.innerHTML = `
    <div class="tour-header">
      <span class="tour-title">🎮 Игра ${game.gameNumber}</span>
      ${roundBadge}
      <span class="tour-tables-count">${countText}</span>
    </div>
    <div class="tour-tables-scroll"></div>
  `;

  const scroll = block.querySelector('.tour-tables-scroll');
  tables.forEach(table => {
    scroll.appendChild(buildGameCard(tournament, game, table, filters));
  });

  return block;
}

// =====================================================================
// RENDER GAME CARD
// =====================================================================
function computeMvp(players) {
  if (!Array.isArray(players) || !players.length) return [];
  const maxPts = Math.max(...players.map(p => p.points || 0));
  if (!(maxPts > 0)) return [];
  return players.filter(p => (p.points || 0) === maxPts);
}
function computeLosingMvp(players, winner) {
  const losing = players.filter(p => winner === 'city' ? !isCityPlayer(p.role) : isCityPlayer(p.role));
  if (!losing.length) return [];
  const maxPts = Math.max(...losing.map(p => p.points || 0));
  if (!(maxPts >= 0.5)) return [];
  return losing.filter(p => (p.points || 0) === maxPts);
}

function favoriteBtnHtml(gameKey, isFavorite) {
  const label = isFavorite ? "В избранном" : "В избранное";
  const icon = isFavorite ? "⭐" : "☆";
  const title = isFavorite ? "Убрать из избранного" : "Добавить в избранное";
  return `<button class="fav-btn ${isFavorite ? "is-favorite" : ""}" type="button" title="${title}" data-game-key="${escapeHtml(gameKey)}" onclick="event.preventDefault();event.stopPropagation();toggleFavorite(this.dataset.gameKey,this);return false;"><span class="fav-icon">${icon}</span><span class="fav-label">${label}</span></button>`;
}

function buildGameCard(tournament, game, table, filters, opts) {
  opts = opts || {};
  const showGameInfo = !!opts.showGameInfo;
  const hideRoles = filters ? filters.hideRoles : false;
  const card = document.createElement('div');
  card.className = 'game-card';

  const gameKey = getGameKey(tournament, game, table);
  const isWatched = !!state.watched[gameKey];
  const isFavorite = !!state.favorites[gameKey];
  if (isWatched) card.classList.add('watched');
  card.dataset.gameKey = gameKey;

  const winnerBadge = table.winner === 'city'
    ? `<span class="badge badge-win">🟥 Победа мирных</span>`
    : `<span class="badge badge-loss">⬛ Победа мафии</span>`;

  const matchedCount = filters && filters.players.length
    ? countMatchedPlayers(table.players, filters.players)
    : 0;
  const matchCountBadge = matchedCount > 0
    ? `<span class="match-count-badge" title="Сколько игроков из фильтра присутствует за столом">🎯 ${matchedCount} из ${table.players.length} из фильтра</span>`
    : '';

  const eloBadge = (typeof table.averageElo === 'number')
    ? `<span class="elo-badge ${getEloClass(table.averageElo)}" title="Среднее ELO стола">📊 ${table.averageElo}</span>`
    : '';

  const copyText = buildCopyText(tournament, game, table);
  const copyBtn = copyText
    ? `<button class="copy-btn" type="button" title="Скопировать" data-copy="${escapeHtml(copyText)}" onclick="event.preventDefault();event.stopPropagation();copyToClipboard(this.dataset.copy,this);return false;">📋</button>`
    : '';
  const searchBtn = copyText
    ? `<button class="copy-btn" type="button" title="Найти в браузере" data-copy="${escapeHtml(copyText)}" onclick="event.preventDefault();event.stopPropagation();copyToClipboard(this.dataset.copy,this);window.open('https://yandex.ru/search/?text='+encodeURIComponent(this.dataset.copy),'_blank','noopener');return false;">🔍</button>`
    : '';
  const openBtn = tournament.url
    ? `<button class="copy-btn" type="button" title="Открыть турнир" onclick="event.preventDefault();event.stopPropagation();window.open('${escapeHtml(tournament.url.split('#')[0])}?tab=games&round=${encodeURIComponent(game.round||'')}','_blank','noopener');return false;">🔗</button>`
    : '';

  let gameMetaLeft;
  if (showGameInfo) {
    const inlineRound = game.round
      ? `<span class="inline-round-badge ${getRoundClass(game.round)}">${escapeHtml(game.round)}</span>`
      : '';
    gameMetaLeft = `<span>Игра ${game.gameNumber}</span><span class="game-dot"></span><span>Стол ${table.tableNumber}</span>${eloBadge}${inlineRound}`;
  } else {
    gameMetaLeft = `<span>Стол ${table.tableNumber}</span>${eloBadge}`;
  }

  const playerTerms = filters ? filters.players : [];
  const mvpArr = computeMvp(table.players);
  const losingMvpArr = computeLosingMvp(table.players, table.winner);
  const mvpLogins = new Set(mvpArr.map(p => p.login));
  const losingMvpLogins = new Set(losingMvpArr.map(p => p.login));

  const compHtml = '<div class="composition-grid">' + table.players.map((p, i) => {
    const isYou = filters.players.length > 0 && playerTerms.some(t => (p.login || '').toLowerCase().includes(t));
    const hideThis = hideRoles && !isYou;
    const roleClass = hideThis ? 'hidden-role' : getRoleCompClass(p.role);
    const lhClass = (!hideThis && p.lhStatus) ? getLhClass(p.lhStatus) : '';
    const loginLower = (p.login || '').toLowerCase();
    const highlight = playerTerms.some(t => loginLower.includes(t)) ? 'highlight' : '';
    const icon = hideThis ? '' : getPlayIcon(p.playType);
    const pts = p.points || 0;
    const ptsStr = pts > 0 ? '+' + pts : String(pts);
    const ptsCls = pts > 0 ? 'p-pos' : pts < 0 ? 'p-neg' : 'p-zero';
    let mvpBadge = '';
    if (!hideThis) {
      if (mvpLogins.has(p.login)) mvpBadge = '<span class="mvp-badge" title="MVP игры">👑</span>';
      else if (losingMvpLogins.has(p.login)) mvpBadge = '<span class="losing-mvp-badge" title="MVP проигравших">🥈</span>';
    }
    const eloText = (typeof p.elo === 'number' && !hideThis) ? `<span class="comp-elo">${p.elo}</span>` : '';
    const roleText = hideThis ? 'Роль скрыта' : `Роль: ${p.role}`;
    const lhText = p.lhStatus ? ` | ЛХ: ${p.lhStatus}` : '';
    return `<div class="composition-player comp-player ${roleClass} ${lhClass} ${highlight}" title="${escapeHtml(p.login)} | ${roleText}${lhText}">
      <span class="comp-num">${i + 1}.</span>
      <span class="comp-name">${escapeHtml(p.login)}${eloText}${mvpBadge}${icon ? ' ' + icon : ''}</span>
      <span class="comp-points ${ptsCls}">${ptsStr}</span>
    </div>`;
  }).join('') + '</div>';

  const watchedBtnHtml = `<button class="watched-btn ${isWatched ? 'is-watched' : ''}" type="button"
    onclick="event.preventDefault();event.stopPropagation();toggleWatched(this.closest('.game-card').dataset.gameKey,this);return false;">
    <span class="watch-icon">${isWatched ? '✅' : '☐'}</span>
    <span class="watch-label">${isWatched ? 'Просмотрено' : 'Посмотрел'}</span>
  </button>`;

  card.innerHTML = `
    <div class="game-meta">
      <span class="game-meta-left">${gameMetaLeft}</span>
      <span class="game-meta-right">${copyBtn}${searchBtn}${openBtn}</span>
    </div>
    ${table.judge ? `<div class="game-judge">👨‍⚖️ Судья: ${escapeHtml(table.judge)}</div>` : ''}
    <div class="game-badges">${winnerBadge}${matchCountBadge}</div>
    ${compHtml}
    <div class="game-card-watched-row" style="gap: 0.5rem;">
      ${watchedBtnHtml}
      ${favoriteBtnHtml(gameKey, isFavorite)}
    </div>
  `;
  return card;
}

// =====================================================================
// THEME
// =====================================================================
const themeToggle = document.getElementById('themeToggle');
if (localStorage.getItem(DEFAULT_THEME_KEY) === 'dark') {
  document.body.classList.add('dark-mode');
  themeToggle.textContent = '☀️ Светлая тема';
}
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  themeToggle.textContent = isDark ? '☀️ Светлая тема' : '🌙 Тёмная тема';
  localStorage.setItem(DEFAULT_THEME_KEY, isDark ? 'dark' : 'light');
});

document.getElementById('clearWatchedBtn').addEventListener('click', clearWatched);
document.getElementById('exportWatchedBtn').addEventListener('click', exportWatched);
</script>
